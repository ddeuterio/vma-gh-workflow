name: Semgrep CE scan

on:
  # Standalone triggers (when deployed to individual repos)
  pull_request:
  workflow_dispatch: {}
  push:
    branches: ["main"]

  # Reusable workflow trigger (called from ci.yml)
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      fail_on_error:
        description: 'Fail the build on HIGH/CRITICAL severity findings'
        required: false
        type: boolean
        default: false
      run_sca:
        description: 'Run SCA'
        required: false
        type: boolean
        default: false
      export_sarif:
        description: 'Export data in sarif format to upload it to GH Security'
        required: false
        type: boolean
        default: false

  # Schedule the CI job (this method uses cron syntax):
  # schedule:
  #   - cron: '20 17 * * *' # Change to a random time

permissions:
  contents: read
  security-events: write  # Required for SARIF upload

jobs:
  semgrep:
    name: semgrep-oss/scan
    runs-on: ubuntu-latest # docker is not installed in slim
    container:
      image: semgrep/semgrep

    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0  # Full git history for diff scanning

      - name: Run Semgrep CI
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "Error: SEMGREP_APP_TOKEN is not set"
            exit 1
          fi

          semgrep ci \
            ${{ inputs.run_sca && '--supply-chain' || '' }} \
            ${{ inputs.export_sarif && '--sarif-output=semgrep.sarif' || '' }} \
            ${{ inputs.fail_on_error && '--no-suppress-errors' || '' }}
        continue-on-error: ${{ !inputs.fail_on_error }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()  # Upload even if scan found issues
        with:
          sarif_file: semgrep.sarif
